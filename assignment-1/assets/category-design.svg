      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cat-ds-drop" x="36" y="34" width="104" height="114" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#78350F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full 176x176 Square Canvas -->
