<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="176" height="176" fill="none">
  <defs>
    <linearGradient id="cat-ui-bg" x1="0" y1="0" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="cat-ui-drop" x="38" y="32" width="100" height="116" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3B0764" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full 176x176 Square Canvas -->
  <rect width="176" height="176" rx="24" fill="url(#cat-ui-bg)"/>
  <rect x="1" y="1" width="174" height="174" rx="23" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Centered Icon (cx=88, cy=88) -->
  <g filter="url(#cat-ui-drop)">
    <!-- Back UI Card -->
    <rect x="58" y="42" width="70" height="54" rx="8" fill="#DDD6FE" fill-opacity="0.5"/>
    <rect x="66" y="50" width="28" height="5" rx="2.5" fill="#8B5CF6" fill-opacity="0.7"/>

    <!-- Front UI Card -->
    <rect x="48" y="56" width="80" height="74" rx="10" fill="#FFFFFF"/>

    <!-- Header bar -->
    <rect x="56" y="66" width="28" height="5" rx="2.5" fill="#8B5CF6"/>

    <!-- Toggle switch -->
    <rect x="96" y="64" width="24" height="12" rx="6" fill="#10B981"/>
    <circle cx="112" cy="70" r="4.5" fill="#FFFFFF"/>

    <!-- Component wireframes -->
    <rect x="56" y="80" width="30" height="30" rx="6" fill="#EDE9FE"/>
    <rect x="62" y="86" width="18" height="18" rx="4" fill="#8B5CF6"/>

    <rect x="94" y="82" width="26" height="6" rx="3" fill="#DDD6FE"/>
    <rect x="94" y="92" width="20" height="5" rx="2.5" fill="#EDE9FE"/>
    <rect x="94" y="101" width="24" height="5" rx="2.5" fill="#EDE9FE"/>
  </g>
</svg>
