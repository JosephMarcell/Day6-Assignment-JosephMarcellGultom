<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="176" height="176" fill="none">
  <defs>
    <linearGradient id="cat-md-bg" x1="0" y1="0" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="cat-md-drop" x="34" y="34" width="108" height="114" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4C0519" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full 176x176 Square Canvas -->
  <rect width="176" height="176" rx="24" fill="url(#cat-md-bg)"/>
  <rect x="1" y="1" width="174" height="174" rx="23" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Centered Icon (cx=88, cy=88) -->
  <g filter="url(#cat-md-drop)">
    <!-- Media Player Console -->
    <rect x="44" y="44" width="88" height="88" rx="14" fill="#18181B"/>

    <!-- Film strip perforations -->
    <rect x="50" y="52" width="10" height="5" rx="1.5" fill="#3F3F46"/>
    <rect x="66" y="52" width="10" height="5" rx="1.5" fill="#3F3F46"/>
    <rect x="82" y="52" width="10" height="5" rx="1.5" fill="#3F3F46"/>
    <rect x="98" y="52" width="10" height="5" rx="1.5" fill="#3F3F46"/>
    <rect x="114" y="52" width="10" height="5" rx="1.5" fill="#3F3F46"/>

    <!-- Center Play Button -->
    <circle cx="88" cy="80" r="18" fill="#F43F5E"/>
    <polygon points="83,72 96,80 83,88" fill="#FFFFFF"/>

    <!-- Equalizer frequency bars -->
    <rect x="54" y="108" width="5" height="14" rx="2.5" fill="#FB7185"/>
    <rect x="65" y="103" width="5" height="19" rx="2.5" fill="#F43F5E"/>
    <rect x="76" y="100" width="5" height="22" rx="2.5" fill="#E11D48"/>
    <rect x="87" y="105" width="5" height="17" rx="2.5" fill="#BE123C"/>
    <rect x="98" y="102" width="5" height="20" rx="2.5" fill="#E11D48"/>
    <rect x="109" y="106" width="5" height="16" rx="2.5" fill="#FB7185"/>
  </g>
</svg>
